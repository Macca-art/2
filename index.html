<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video 4k Ultra Cảnh Hoàng Hôn Buông Đẹp Ngất Ngây</title>
    
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    
    <style>
        body {
            margin: 0;
            overflow: hidden;
        }
    </style>
</head>
<body>

    <a-scene>
        
        <a-assets>
            <video id="video360" 
                   src="https://www.youtube.com/watch?v=7uay0tpKFkQ" 
                   autoplay 
                   loop 
                   crossorigin="anonymous" 
                   playsinline 
                   webkit-playsinline>
            </video>
        </a-assets>

        <a-videosphere src="#video360" rotation="0 -90 0"></a-videosphere>

        <a-entity camera look-controls></a-entity>

    </a-scene>

</body>
</html>
